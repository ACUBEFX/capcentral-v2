
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CapCentral</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CapCentral authentication styles -->
    <link rel="stylesheet" href="/auth.css">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="text-center">
            <div class="auth-brand">C</div>

            <h1 class="auth-heading">Welcome back</h1>

            <p class="auth-subheading">
                Sign in to your CapCentral account to continue shopping.
            </p>
        </div>

        <!-- Google login -->
        <a href="/auth/google" class="google-button">
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.72 5.99c4.51-4.17 7.05-10.31 7.05-17.64z"/>
                <path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.96 23.96 0 0 0 0 21.56l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.81l-7.72-5.99c-2.14 1.44-4.89 2.3-8.19 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
        </a>

        <div class="auth-divider">OR CONTINUE WITH EMAIL</div>

        <!-- Email login -->
        <form action="/login" method="POST">

            <div class="auth-field">
                <label for="email" class="auth-label">Email address</label>
                <input
                    type="email"
                    class="form-control auth-input"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-field">
                <label for="password" class="auth-label">Password</label>
                <input
                    type="password"
                    class="form-control auth-input"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="auth-forgot">
                <a href="/resetpassword.html" class="auth-link">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="btn auth-submit">
                Sign In
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="/signup">Create an account</a>
        </p>

    </main>

    <!-- Existing CSRF protection -->
    <script src="/csrf-client.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
