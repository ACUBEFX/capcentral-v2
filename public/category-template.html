 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cap Central | Products</title>

    
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/catalogue-page.css">
<link rel="stylesheet" href="/dynamic-category.css">



</head>
<body class="dynamic-category-page">

   
<header>
    <div class="logo">
        <a href="/"><img src="jpg/logo.jpeg" alt="Cap Central Logo"></a>
    </div>

    <h1 id="brandname">Cap Central</h1>

    <div class="header-icons">
        <div class="cart-icon" role="button" tabindex="0" aria-label="Open cart">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-count">0</div>
        </div>

        <div class="profile-icon">
            <a id="profile-icon" href="/login" aria-label="Account">
                <i class="fas fa-user"></i>
            </a>
        </div>
    </div>
</header>

<nav class="page-navigation">
    <div class="nav-container">
        <div id="burger" class="burger-menu" aria-label="Open menu" role="button" tabindex="0">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul id="nav-links" class="nav-links"></ul>
    </div>
</nav>

    <main class="main">
        <div class="products-header">
            <h2 id="category-title">Products</h2>
            <p id="category-description">Discover our collection.</p>
        </div>

        <div class="product-grid" aria-live="polite">
            <p class="catalogue-loading">Loading products...</p>
        </div>

        <div class="cart-items" style="display:none;"></div>

        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close" role="button" tabindex="0" aria-label="Close">&times;</span>
                <div class="modal-image-container">
                    <img id="modal-product-image" class="modal-image" src="" alt="Product image">
                </div>
                <div class="modal-info">
                    <h2 id="modal-product-name"></h2>
                    <div id="modal-product-price" class="modal-price"></div>
                    <div id="modal-product-description" class="modal-desc"></div>
                    <button id="add-to-cart-button" type="button">
                        <i class="fas fa-shopping-cart"></i> Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>

   <!-- CATEGORY_CONFIG -->


<script src="/script.js"></script>
<script src="/script2.js"></script>
<script src="/catalogue-page.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const menu = document.getElementById('nav-links');
    if (!menu) return;

    try {
        const response = await fetch('/api/categories/public', {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error('Could not load categories.');
        }

        const result = await response.json();

        if (!result.success || !Array.isArray(result.categories)) {
            throw new Error('Invalid category response.');
        }

        menu.replaceChildren();

        result.categories.forEach(category => {
            const item = document.createElement('li');
            const link = document.createElement('a');

            link.href = '/' + encodeURIComponent(category.slug);
            link.textContent = category.name;

            item.appendChild(link);
            menu.appendChild(item);
        });
    } catch (error) {
        console.error('Category navigation error:', error);
    }
});
</script>


</body>
</html>
