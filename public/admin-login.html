
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CapCentral Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            margin: 0 0 8px;
            color: #111827;
        }

        .brand p {
            margin: 0;
            color: #6b7280;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #111827;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #4b5563;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .notice {
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            background: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <h1>CapCentral</h1>
            <p>Administrator Portal</p>
        </div>

        <form action="/admin/login" method="POST">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In to Admin</button>
        </form>

        <div class="notice">
            Restricted access. Only authorized administrators can sign in.
        </div>

        <a class="back-link" href="/login">
            Return to customer login
        </a>
    </main>
    <script src="/csrf-client.js" defer></script>
</body>
</html>
